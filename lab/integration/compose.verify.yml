# 사용자 DB/큐와 분리한 검증 전용 환경. 기본 compose.yml과 병합하지 않는다.
name: arsm-integration-verify
services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=128MB"]
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: integration
    volumes: ["verify-data:/var/lib/postgresql/data", "./init.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration"]
      interval: 2s
      timeout: 2s
      retries: 30
  broker:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: integration
      RABBITMQ_DEFAULT_PASS: integration-local
  review:
    image: arsm-integration-review:latest
    environment:
      LAB_ROLE: review
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/integration?currentSchema=review
      POINTS_URL: http://points:8082
      HTTP_READ_MS: 1000
    ports: ["127.0.0.1:18081:8081"]
    depends_on:
      db: {condition: service_healthy}
  points:
    image: arsm-integration-points:latest
    environment:
      LAB_ROLE: points
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://db:5432/integration?currentSchema=points
    ports: ["127.0.0.1:18082:8082"]
    depends_on:
      db: {condition: service_healthy}
  points-backup:
    image: arsm-integration-points:latest
    environment:
      LAB_ROLE: points
      LAB_PROVIDER: backup
      SPRING_SQL_INIT_MODE: never
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://db:5432/integration?currentSchema=points
    ports: ["127.0.0.1:18083:8083"]
    depends_on:
      db: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:19091:9090"]
volumes:
  verify-data:
